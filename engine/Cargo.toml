[package]
name = "syncflowy"
version = "0.1.0"
edition = "2024"
description = "Workflowy <-> Markdown sync engine (see docs/sync-design.md)"
publish = false

[lib]
name = "syncflowy"
path = "src/lib.rs"

[[bin]]
name = "syncflowy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"
notify = "8"
log = "0.4"
env_logger = "0.11"
regex = "1"
similar = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.10"
signal-hook = "0.4"

[dev-dependencies]
proptest = "1"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
