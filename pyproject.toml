[project]
name = "syncflowy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nelson Elhage", email = "nelhage@nelhage.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
syncflowy = "syncflowy:main"
syncflowy-mock = "syncflowy.mock.cli:main"
syncflowy-conformance = "syncflowy.conformance.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
